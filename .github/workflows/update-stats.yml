name: Update Repository Stats

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'stats/**'
      - 'LICENSE'
      - 'README.md'
      - 'README-en_US.md'

  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: repository-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate statistics SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .repository-config/scripts/generate_stats.py

      - name: Commit SVG updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats/repository-stats-light.svg stats/repository-stats-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update repository stats'
            git push
          fi
