name: 其他反馈
description: 提出其他问题、咨询或项目相关反馈
title: "[反馈]: "
labels: ["反馈"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢你愿意向我们反馈！

        在提交之前，请先确认：

        ### 请先搜索现有的 Issue，确认没有相同或类似的内容。
        ### 请尽可能清楚、完整地描述你的问题或想法。
        ### 如果你不确定如何描述问题，请阅读 [《提问的智慧》](https://github.com/ryanhanwu/How-To-Ask-Questions-The-Smart-Way/blob/main/README-zh_CN.md)。

        ---

  - type: checkboxes
    id: terms
    attributes:
      label: 提交前确认
      options:
        - label: 我已经确认这个问题不属于「错误反馈」「版本收录」或「功能建议」模板的范围。
          required: true
        - label: 我已经在 [Issue](https://github.com/Spectrollay-StardewValley/Repository/issues) 中搜索过，没有找到相同或类似的内容。
          required: true
        - label: 我确认本 Issue 的内容与本项目有关。
          required: true
        - label: 我已知晓，如果没有按照模板要求提供必要信息，该 Issue 可能会被要求补充信息或关闭。
          required: true

  - type: textarea
    id: description
    attributes:
      label: 内容描述
      description: 请详细描述你想要反馈、咨询或讨论的内容。
      placeholder: |
        请在这里输入你的内容...

        如果涉及具体版本、文件或网站页面，也请一并说明。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 如果还有其他需要说明的内容，可以在这里补充。
    validations:
      required: false

  - type: input
    id: name
    attributes:
      label: 你的名称
      description: 选填，用于后续贡献展示。可留空。
    validations:
      required: false

  - type: input
    id: email
    attributes:
      label: 联系邮箱
      description: 选填，仅用于可能的进一步沟通。可留空。请注意，公开 Issue 中填写的邮箱也会公开显示。
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ## 感谢你的反馈！

        我们会在确认内容后进行处理。如果需要补充信息，我们可能会在 Issue 中留言。涉及项目协作的事宜，请与开发者取得联系。